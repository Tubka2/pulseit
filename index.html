<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100f0e">
  <meta name="description" content="Przerwa techniczna. Wrócimy do Ciebie już wkrótce.">
  <title>Przerwa techniczna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23100f0e'/%3E%3Cpath d='M8 34h14l6-18 8 32 6-14h14' fill='none' stroke='%23ff5a36' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #100f0e;
      color: #f7f5f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 50% 42%, rgb(255 90 54 / 10%), transparent 48%),
        radial-gradient(ellipse at 12% 90%, rgb(255 90 54 / 7%), transparent 32%),
        #100f0e;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: linear-gradient(rgb(255 255 255 / 2.5%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 2.5%) 1px, transparent 1px);
      background-size: 56px 56px;
      content: "";
      mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 75%, transparent);
      pointer-events: none;
    }

    .maintenance {
      position: relative;
      z-index: 1;
      width: min(100%, 610px);
      padding: clamp(32px, 7vw, 58px);
      border: 1px solid rgb(255 255 255 / 9%);
      border-radius: 28px;
      background: linear-gradient(145deg, rgb(35 33 31 / 94%), rgb(22 21 20 / 96%));
      box-shadow: 0 32px 100px rgb(0 0 0 / 44%), 0 1px 0 rgb(255 255 255 / 4%) inset;
      text-align: center;
      animation: rise-in 700ms cubic-bezier(.2, .75, .25, 1) both;
    }

    .brand {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 10px;
      margin: 0 auto clamp(28px, 7vw, 48px);
      color: #f7f5f2;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.04em;
      text-decoration: none;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      padding: 7px;
      border-radius: 11px;
      background: #100f0e;
    }

    .eyebrow {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 9px;
      margin: 0 auto 19px;
      color: #ff8064;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff684a;
      box-shadow: 0 0 12px rgb(255 104 74 / 75%);
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 54px);
      font-weight: 720;
      letter-spacing: -.055em;
      line-height: 1.08;
    }

    .message {
      max-width: 390px;
      margin: 19px auto 0;
      color: #aaa6a1;
      font-size: 15px;
      line-height: 1.7;
    }

    .divider {
      width: 42px;
      height: 1px;
      margin: 33px auto 27px;
      background: linear-gradient(90deg, transparent, rgb(255 255 255 / 24%), transparent);
    }

    .estimate-label {
      margin: 0 0 17px;
      color: #c9c5c0;
      font-size: 13px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-width: 410px;
      margin: 0 auto;
    }

    .time-unit {
      padding: 16px 8px 13px;
      border: 1px solid rgb(255 255 255 / 7%);
      border-radius: 14px;
      background: rgb(255 255 255 / 3%);
    }

    .time-value {
      display: block;
      color: #fff;
      font-size: clamp(25px, 6vw, 34px);
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.1;
    }

    .time-label {
      display: block;
      margin-top: 8px;
      color: #918d88;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .fine-print {
      margin: 22px 0 0;
      color: #77736f;
      font-size: 11px;
    }

    .finished {
      display: none;
      margin: 22px 0 0;
      color: #c9c5c0;
      font-size: 14px;
    }

    .countdown.is-finished + .fine-print {
      display: none;
    }

    .countdown.is-finished ~ .finished {
      display: block;
    }

    @keyframes pulse {
      50% { opacity: .48; }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .maintenance {
        padding: 32px 20px;
        border-radius: 23px;
      }

      .countdown {
        gap: 6px;
      }

      .time-unit {
        padding: 14px 3px 12px;
      }

      .time-label {
        font-size: 9px;
        letter-spacing: .06em;
      }
    }

    @media (max-width: 360px) {
      body {
        padding-right: 14px;
        padding-left: 14px;
      }

      .maintenance {
        padding-right: 15px;
        padding-left: 15px;
      }

      .countdown {
        gap: 5px;
      }

      .time-unit {
        padding-right: 1px;
        padding-left: 1px;
      }

      .time-value {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="maintenance" aria-labelledby="page-title">
    <a class="brand" href="https://tubka2.github.io/pulseit/" target="_blank" rel="noopener noreferrer" aria-label="Pulse — przejdź do projektu">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 34h14l6-18 8 32 6-14h14" fill="none" stroke="#ff5a36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Pulse</span>
    </a>

    <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Chwila przerwy</p>
    <h1 id="page-title">Przepraszamy!</h1>
    <p class="message">Trwa przerwa techniczna. Pracujemy nad tym, żeby wszystko znów działało jak należy.</p>

    <div class="divider" aria-hidden="true"></div>
    <p class="estimate-label">Szacowany czas zakończenia prac</p>

    <div class="countdown" id="countdown" role="timer" aria-label="Odliczanie do zakończenia przerwy technicznej">
      <div class="time-unit"><span class="time-value" id="days">00</span><span class="time-label" id="days-label">dni</span></div>
      <div class="time-unit"><span class="time-value" id="hours">00</span><span class="time-label" id="hours-label">godzin</span></div>
      <div class="time-unit"><span class="time-value" id="minutes">00</span><span class="time-label" id="minutes-label">minut</span></div>
      <div class="time-unit"><span class="time-value" id="seconds">00</span><span class="time-label" id="seconds-label">sekund</span></div>
    </div>
    <p class="fine-print">25 listopada 2026, godz. 17:30</p>
    <p class="finished" id="finished-message">Planowany czas zakończenia prac minął. Dziękujemy za cierpliwość!</p>
  </main>

  <script>
    const deadline = new Date("2026-11-25T17:30:00+01:00").getTime();
    const countdown = document.getElementById("countdown");
    const units = {
      days: {
        value: document.getElementById("days"),
        label: document.getElementById("days-label"),
        forms: ["dzień", "dni", "dni"]
      },
      hours: {
        value: document.getElementById("hours"),
        label: document.getElementById("hours-label"),
        forms: ["godzina", "godziny", "godzin"]
      },
      minutes: {
        value: document.getElementById("minutes"),
        label: document.getElementById("minutes-label"),
        forms: ["minuta", "minuty", "minut"]
      },
      seconds: {
        value: document.getElementById("seconds"),
        label: document.getElementById("seconds-label"),
        forms: ["sekunda", "sekundy", "sekund"]
      }
    };

    function polishUnitForm(value, forms) {
      const lastTwoDigits = value % 100;
      if (value === 1) return forms[0];
      if (lastTwoDigits >= 12 && lastTwoDigits <= 14) return forms[2];

      const lastDigit = value % 10;
      return lastDigit >= 2 && lastDigit <= 4 ? forms[1] : forms[2];
    }

    function renderUnit(name, value) {
      const unit = units[name];
      unit.value.textContent = String(value).padStart(2, "0");
      unit.label.textContent = polishUnitForm(value, unit.forms);
    }

    function updateCountdown() {
      const remaining = deadline - Date.now();

      if (remaining <= 0) {
        Object.keys(units).forEach((name) => renderUnit(name, 0));
        countdown.classList.add("is-finished");
        window.clearInterval(timer);
        return;
      }

      const secondsLeft = Math.floor(remaining / 1000);
      renderUnit("days", Math.floor(secondsLeft / 86400));
      renderUnit("hours", Math.floor((secondsLeft % 86400) / 3600));
      renderUnit("minutes", Math.floor((secondsLeft % 3600) / 60));
      renderUnit("seconds", secondsLeft % 60);
    }

    const timer = window.setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
